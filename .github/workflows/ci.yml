name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.94.1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev libbsd-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: cargo build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev libbsd-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo audit --deny warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev libbsd-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --no-run
        name: Compile all tests (including ignored)
      - run: cargo test --all

  python:
    name: python sidecar (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install Python + deps
        run: |
          cd python-sidecar
          uv python install 3.13
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e .[dev]
      - name: Lint
        run: cd python-sidecar && .venv/bin/ruff check src
      - name: Test
        run: cd python-sidecar && .venv/bin/python -m pytest -x

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bench:
    name: cargo bench (PR vs main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev libbsd-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      - name: Checkout merge-base of main
        run: |
          PR_HEAD=$(git rev-parse HEAD)
          BASE=$(git merge-base origin/main HEAD)
          echo "PR_HEAD=$PR_HEAD" >> $GITHUB_ENV
          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "Baseline commit: $BASE"
          echo "PR head commit: $PR_HEAD"

      - name: Bench baseline (merge-base of main)
        run: |
          git checkout $BASE
          cargo bench --bench critical_path -- --save-baseline main --warm-up-time 1 --measurement-time 3 --sample-size 10 2>&1 | tee /tmp/bench-main.txt

      - name: Bench PR head (compared to baseline)
        run: |
          git checkout $PR_HEAD
          cargo bench --bench critical_path -- --baseline main --warm-up-time 1 --measurement-time 3 --sample-size 10 2>&1 | tee /tmp/bench-pr.txt

      - name: Summarize result
        run: |
          echo "### Benchmark: PR vs main baseline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(time:|change:|Performance has|No change)" /tmp/bench-pr.txt | head -80 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: rust-core/target/criterion/
          retention-days: 14

  notifier:
    name: notifier (C++ build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ libcurl4-openssl-dev
      - name: Build
        run: |
          cmake -S notifier -B notifier/build -DCMAKE_BUILD_TYPE=Release
          cmake --build notifier/build -j
      - name: Smoke test (/healthz, /stats, de-dup, filter, budget, retry)
        run: |
          printf '[listen]\nhost="127.0.0.1"\nport=8095\n[ntfy]\nbase_url="http://127.0.0.1:9"\ntoken=""\n[policy]\ndedup_window_s=30\n[filter]\nmin_priority=2\nmute_titles=["mute"]\n[budget]\nmax_per_window=2\nwindow_s=43200\nreserve_priority=5\n[reliability]\nmax_attempts=1\nbase_s=1\n' > /tmp/notifier_ci.toml
          ./notifier/build/notifier /tmp/notifier_ci.toml &
          for i in $(seq 1 30); do curl -sf localhost:8095/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -sf localhost:8095/healthz | grep -q '"healthy":true'
          post() { curl -s -X POST localhost:8095/ -H 'Content-Type: application/json' -d "$1" >/dev/null; }
          # de-dup: 3 identical -> deduped=2 (1 forward uses 1 budget)
          for i in 1 2 3; do post '{"topic":"t","title":"dup","message":"same","priority":3}'; done
          # filter: below min_priority + muted title -> filtered=2
          post '{"topic":"t","title":"lowp","message":"x","priority":1}'
          post '{"topic":"t","title":"mute-this","message":"x","priority":3}'
          # budget: max=2 -> after 2 forwards, drop; priority>=5 bypasses
          post '{"topic":"t","title":"a","message":"x","priority":3}'
          post '{"topic":"t","title":"b","message":"x","priority":3}'
          post '{"topic":"t","title":"c","message":"x","priority":3}'
          post '{"topic":"t","title":"crit","message":"x","priority":5}'
          STATS=$(curl -sf localhost:8095/stats); echo "stats: $STATS"
          echo "$STATS" | grep -q '"deduped":2'
          echo "$STATS" | grep -q '"filtered":2'
          echo "$STATS" | grep -q '"budget_dropped":2'
          # reliability: failed forwards (dummy upstream) get queued, retried, then dropped
          RD=0
          for i in $(seq 1 20); do
            RD=$(curl -sf localhost:8095/stats | grep -o '"retry_dropped":[0-9]*' | grep -oE '[0-9]+')
            [ "${RD:-0}" -ge 1 ] && break
            sleep 1
          done
          echo "retry_dropped=$RD"
          [ "${RD:-0}" -ge 1 ]
